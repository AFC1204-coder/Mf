<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segundo Cerebro Soberano</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c9a84c;
    --accent-dim: #8a6f2e;
    --text: #e8e8e8;
    --text-dim: #888;
    --text-muted: #555;
    --danger: #c0392b;
    --success: #27ae60;
    --highlight: #f1c40f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }

  /* NAV */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.8rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .nav-brand {
    font-size: 0.85rem; color: var(--accent); letter-spacing: 0.05em;
    text-transform: uppercase; cursor: pointer; user-select: none;
    transition: opacity 0.15s;
  }
  .nav-brand:hover { opacity: 0.75; }
  .nav-links { display: flex; gap: 0.5rem; }
  .nav-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); padding: 0.4rem 0.8rem;
    border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    transition: all 0.15s;
  }
  .nav-btn:hover, .nav-btn.active { border-color: var(--accent); color: var(--accent); }
  .nav-btn.accent { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
  .nav-btn.accent:hover { background: var(--accent-dim); }

  /* MAIN */
  main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

  /* VIEWS */
  .view { display: none; }
  .view.active { display: block; }

  /* HOME */
  .home-header { margin-bottom: 2rem; }
  .home-header h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 0.3rem; }
  .home-header p { color: var(--text-dim); font-size: 0.85rem; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 2rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 1rem; border-radius: 6px; text-align: center;
  }
  .stat-card .num { font-size: 1.8rem; color: var(--accent); font-weight: bold; }
  .stat-card .label { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.3rem; text-transform: uppercase; }

  .quick-actions { display: flex; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .qa-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.7rem 1.2rem;
    border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    transition: all 0.15s; display: flex; align-items: center; gap: 0.5rem;
  }
  .qa-btn:hover { border-color: var(--accent); color: var(--accent); }
  .qa-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
  .qa-btn.primary:hover { background: var(--accent-dim); }

  .section-title {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted); margin-bottom: 1rem;
    border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;
  }

  /* EJE FILTER */
  .eje-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .eje-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); padding: 0.3rem 0.8rem;
    border-radius: 20px; cursor: pointer; font-size: 0.72rem;
    transition: all 0.15s;
  }
  .eje-btn:hover { border-color: var(--accent); color: var(--accent); }
  .eje-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* SEARCH BAR */
  .search-wrap { position: relative; margin-bottom: 1.2rem; }
  .search-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.7rem 1rem 0.7rem 2.5rem;
    border-radius: 6px; font-size: 0.85rem; outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
  .search-clear { position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; display: none; }
  .search-clear.visible { display: block; }

  mark.highlight { background: var(--highlight); color: #000; border-radius: 2px; padding: 0 1px; }

  /* LIBRO CARD */
  .libros-grid { display: grid; gap: 0.7rem; }
  .libro-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 1rem 1.2rem; border-radius: 6px; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; justify-content: space-between;
  }
  .libro-card:hover { border-color: var(--accent); }
  .libro-info h3 { font-size: 0.95rem; margin-bottom: 0.2rem; }
  .libro-info .autor { font-size: 0.75rem; color: var(--text-dim); }
  .libro-meta { display: flex; gap: 0.5rem; align-items: center; }
  .eje-tag {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 0.2rem 0.6rem; border-radius: 3px; border: 1px solid;
  }
  .eje-tag.economia { color: #c9a84c; border-color: #c9a84c33; background: #c9a84c11; }
  .eje-tag.psicologia { color: #9b59b6; border-color: #9b59b633; background: #9b59b611; }
  .eje-tag.filosofia { color: #3498db; border-color: #3498db33; background: #3498db11; }
  .eje-tag.neurociencia { color: #1abc9c; border-color: #1abc9c33; background: #1abc9c11; }
  .eje-tag.desarrollo { color: #e67e22; border-color: #e67e2233; background: #e67e2211; }
  .libro-progress { font-size: 0.7rem; color: var(--text-dim); }

  /* FAVORITOS */
  .fav-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.1rem; color: var(--text-muted);
    transition: all 0.15s; padding: 0.2rem 0.3rem;
    line-height: 1; flex-shrink: 0;
  }
  .fav-btn:hover { color: var(--accent); transform: scale(1.2); }
  .fav-btn.active { color: var(--accent); }

  /* LECCIONES */
  .back-btn {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 0.8rem; padding: 0 0 1rem 0; display: flex; align-items: center; gap: 0.4rem;
  }
  .libro-header { margin-bottom: 1.5rem; }
  .libro-header h2 { font-size: 1.3rem; margin-bottom: 0.3rem; }
  .libro-header .autor { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 0.8rem; }

  .leccion-item {
    background: var(--surface); border: 1px solid var(--border);
    padding: 0.9rem 1.2rem; border-radius: 6px; cursor: pointer;
    margin-bottom: 0.6rem; transition: all 0.15s;
    display: flex; align-items: center; justify-content: space-between;
  }
  .leccion-item:hover { border-color: var(--accent); }
  .leccion-item.completada { border-left: 3px solid var(--success); }
  .leccion-item.repaso { border-left: 3px solid var(--accent); }
  .leccion-left h4 { font-size: 0.9rem; margin-bottom: 0.3rem; }
  .leccion-meta-row { display: flex; gap: 0.8rem; align-items: center; }
  .leccion-orden { font-size: 0.7rem; color: var(--text-muted); }
  .autores-badge {
    font-size: 0.65rem; color: var(--text-dim); background: var(--surface2);
    padding: 0.15rem 0.5rem; border-radius: 3px; border: 1px solid var(--border);
  }
  .leccion-status { font-size: 0.7rem; }
  .leccion-status.ok { color: var(--success); }
  .leccion-status.pending { color: var(--text-muted); }

  /* DETALLE LECCION */
  .leccion-imagen-wrap {
    margin-bottom: 1.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .leccion-imagen-wrap img {
    width: 100%;
    max-height: 380px;
    object-fit: cover;
    filter: grayscale(15%) brightness(0.9);
    display: block;
    transition: filter 0.3s;
  }
  .leccion-imagen-wrap img:hover { filter: grayscale(0%) brightness(1); }
  .leccion-imagen-caption {
    background: var(--surface);
    padding: 0.6rem 0.9rem;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-style: italic;
    border-top: 1px solid var(--border);
  }

  .leccion-titulo { font-size: 1.3rem; margin-bottom: 1rem; color: var(--accent); }

  /* ═══════════════════════════════════════════════
     FORMATTED TEXT — párrafos, listas, negritas
  ═══════════════════════════════════════════════ */
  .formatted-text { line-height: 1.85; font-size: 0.92rem; color: var(--text); }
  .formatted-text p { margin-bottom: 1rem; }
  .formatted-text p:last-child { margin-bottom: 0; }

  /* Listas numeradas */
  .formatted-text ol {
    margin: 0.8rem 0 1rem 1.4rem;
    padding: 0;
    list-style: decimal;
  }
  .formatted-text ol li {
    margin-bottom: 0.55rem;
    padding-left: 0.3rem;
    line-height: 1.7;
    color: var(--text);
  }
  .formatted-text ol li::marker {
    color: var(--accent);
    font-weight: bold;
  }

  /* Listas con viñeta */
  .formatted-text ul {
    margin: 0.8rem 0 1rem 0;
    padding: 0;
    list-style: none;
  }
  .formatted-text ul li {
    margin-bottom: 0.55rem;
    padding-left: 1.4rem;
    position: relative;
    line-height: 1.7;
    color: var(--text);
  }
  .formatted-text ul li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--accent-dim);
    font-weight: bold;
  }

  /* Negritas */
  .formatted-text strong {
    color: var(--accent);
    font-weight: bold;
  }

  /* Clases de uso */
  .leccion-cuerpo { margin-bottom: 1.8rem; }
  .detalle-card p { font-size: 0.85rem; }

  /* ═══════════════════════════════════════════════ */

  .detalles-grid { display: grid; gap: 1rem; margin-bottom: 1.5rem; }
  .detalle-card {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 1rem 1.2rem; border-radius: 6px;
  }
  .detalle-card h4 {
    font-size: 0.78rem; color: var(--accent); margin-bottom: 0.8rem;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;
  }

  .conexion-box {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent-dim);
    padding: 1rem 1.1rem; border-radius: 6px; margin-bottom: 1rem;
    font-size: 0.82rem; line-height: 1.7;
  }
  .conexion-label {
    font-size: 0.62rem; text-transform: uppercase;
    color: var(--accent-dim); margin-bottom: 0.6rem;
    letter-spacing: 0.08em;
  }

  .autores-rel { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .autor-tag {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); padding: 0.25rem 0.7rem;
    border-radius: 3px; font-size: 0.72rem; cursor: pointer;
    transition: all 0.15s;
  }
  .autor-tag:hover { border-color: var(--accent); color: var(--accent); }

  .leccion-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  .action-btn {
    padding: 0.6rem 1.2rem; border-radius: 5px; cursor: pointer;
    font-size: 0.8rem; border: 1px solid; transition: all 0.15s;
  }
  .action-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
  .action-btn.primary:hover { background: var(--accent-dim); }
  .action-btn.secondary { background: none; color: var(--text-dim); border-color: var(--border); }
  .action-btn.secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* TEST */
  .test-header { margin-bottom: 2rem; }
  .test-progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 0.5rem; }
  .test-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .test-counter { font-size: 0.75rem; color: var(--text-dim); }

  .pregunta-card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 8px; }
  .pregunta-eje { font-size: 0.65rem; text-transform: uppercase; color: var(--accent-dim); margin-bottom: 0.8rem; }
  .pregunta-texto { font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; }
  .opciones-grid { display: grid; gap: 0.6rem; }
  .opcion-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 0.8rem 1rem;
    border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    text-align: left; transition: all 0.15s; line-height: 1.4;
  }
  .opcion-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .opcion-btn.correcta { border-color: var(--success); background: #27ae6011; color: var(--success); }
  .opcion-btn.incorrecta { border-color: var(--danger); background: #c0392b11; color: var(--danger); }
  .opcion-btn:disabled { cursor: default; }

  .feedback-box { margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 6px; font-size: 0.82rem; line-height: 1.6; }
  .feedback-box.correcto { background: #27ae6011; border: 1px solid var(--success); color: #5dde8d; }
  .feedback-box.incorrecto { background: #c0392b11; border: 1px solid var(--danger); color: #e07070; }

  .test-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }

  /* RESULTADOS */
  .resultado-card { background: var(--surface); border: 1px solid var(--border); padding: 2rem; border-radius: 8px; text-align: center; }
  .resultado-score { font-size: 3.5rem; font-weight: bold; color: var(--accent); margin: 1rem 0; }
  .resultado-label { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 2rem; }
  .fallos-list { text-align: left; margin-top: 1.5rem; }
  .fallo-item { background: var(--surface2); border: 1px solid var(--border); padding: 0.8rem; border-radius: 5px; margin-bottom: 0.5rem; font-size: 0.8rem; border-left: 3px solid var(--danger); }

  /* REPASO RAPIDO */
  .repaso-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
  .repaso-header h2 { font-size: 1.2rem; }
  .repaso-counter { font-size: 0.75rem; color: var(--text-dim); }

  /* VISTA AUTOR */
  .autor-header { margin-bottom: 2rem; }
  .autor-header h2 { font-size: 1.3rem; margin-bottom: 0.3rem; }
  .autor-header p { font-size: 0.8rem; color: var(--text-dim); }

  /* FAVORITOS VIEW */
  .fav-empty {
    text-align: center; padding: 2rem; color: var(--text-muted);
    font-size: 0.85rem; border: 1px dashed var(--border);
    border-radius: 6px;
  }
  .fav-empty span { font-size: 1.5rem; display: block; margin-bottom: 0.5rem; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: #000000cc;
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 1rem;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 1.5rem; max-width: 500px; width: 100%;
  }
  .modal-title { font-size: 1rem; margin-bottom: 1rem; color: var(--accent); }
  .modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem; }

  /* LOADING */
  .loading { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.85rem; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 0.5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 3rem; color: var(--text-muted); }

  /* TOAST */
  #toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: var(--surface2); border: 1px solid var(--accent);
    color: var(--text); padding: 0.7rem 1.2rem;
    border-radius: 6px; font-size: 0.8rem; z-index: 300;
    opacity: 0; transform: translateY(10px);
    transition: all 0.2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .nav-brand { font-size: 0.75rem; }
  }
</style>
</head>
<body>

<nav>
  <span class="nav-brand" onclick="showView('home')" title="Inicio">⬡ Segundo Cerebro</span>
  <div class="nav-links">
    <button class="nav-btn active" onclick="showView('home')" id="nav-home">Biblioteca</button>
    <button class="nav-btn" onclick="showView('favoritos')" id="nav-favoritos">★ Favoritos</button>
    <button class="nav-btn" onclick="iniciarTest()" id="nav-test">Test</button>
    <button class="nav-btn accent" onclick="comenzarRepasoRapido()" title="5 lecciones más antiguas">⚡ Repaso</button>
  </div>
</nav>

<main>

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div class="home-header">
      <h1>Biblioteca</h1>
      <p>Corpus intelectual — <span id="total-libros">—</span> libros · <span id="total-lecciones">—</span> lecciones</p>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="stat-libros">—</div><div class="label">Libros</div></div>
      <div class="stat-card"><div class="num" id="stat-lecciones">—</div><div class="label">Lecciones</div></div>
      <div class="stat-card"><div class="num" id="stat-completadas">—</div><div class="label">Completadas</div></div>
      <div class="stat-card"><div class="num" id="stat-preguntas">—</div><div class="label">Preguntas</div></div>
    </div>
    <div class="quick-actions">
      <button class="qa-btn primary" onclick="iniciarTest()">▶ Test adaptativo</button>
      <button class="qa-btn" onclick="leccionAleatoria()" title="Lección no completada al azar">🎲 Sorpréndeme</button>
      <button class="qa-btn" onclick="comenzarRepasoRapido()">⚡ Repaso rápido</button>
    </div>
    <p class="section-title">Explorar por eje</p>
    <div class="eje-filters" id="eje-filters">
      <button class="eje-btn active" onclick="filtrarEje(null, this)">Todos</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="text" placeholder="Buscar libros, autores..." oninput="onSearch(this.value)">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <div id="libros-container">
      <div class="loading"><div class="spinner"></div><br>Cargando biblioteca...</div>
    </div>
  </div>

  <!-- FAVORITOS -->
  <div class="view" id="view-favoritos">
    <div class="home-header">
      <h1>★ Favoritos</h1>
      <p>Libros y lecciones guardados</p>
    </div>
    <p class="section-title" id="fav-libros-title">Libros</p>
    <div id="fav-libros-container"></div>
    <p class="section-title" style="margin-top:1.8rem" id="fav-lecciones-title">Lecciones</p>
    <div id="fav-lecciones-container"></div>
  </div>

  <!-- LECCIONES DE UN LIBRO -->
  <div class="view" id="view-lecciones">
    <button class="back-btn" onclick="showView('home')">← Biblioteca</button>
    <div class="libro-header">
      <h2 id="libro-titulo-header">—</h2>
      <div class="autor" id="libro-autor-header">—</div>
      <div id="libro-eje-header"></div>
    </div>
    <div class="search-wrap" style="margin-bottom:1.2rem">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-lecciones" type="text" placeholder="Buscar lección..." oninput="onSearchLecciones(this.value)">
    </div>
    <div id="lecciones-container"></div>
  </div>

  <!-- DETALLE LECCION -->
  <div class="view" id="view-leccion">
    <button class="back-btn" id="back-from-leccion" onclick="volverDeLeccion()">← Lecciones</button>
    <div id="leccion-contenido"></div>
  </div>

  <!-- TEST -->
  <div class="view" id="view-test">
    <div class="test-header">
      <div class="test-progress-bar">
        <div class="test-progress-fill" id="test-progress-fill" style="width:0%"></div>
      </div>
      <span class="test-counter" id="test-counter">Pregunta 1 de 10</span>
    </div>
    <div id="pregunta-container"></div>
    <div class="test-nav">
      <button class="action-btn secondary" onclick="showView('home')">← Salir</button>
      <button class="action-btn primary" id="btn-siguiente" onclick="siguientePregunta()" style="display:none">Siguiente →</button>
    </div>
  </div>

  <!-- RESULTADOS TEST -->
  <div class="view" id="view-resultados">
    <div id="resultados-container"></div>
  </div>

// ─── FORMAT TEXT ─────────────────────────────────────────────────────────────
// Convierte texto plano en HTML con párrafos, listas y negritas
function formatText(raw) {
  if (!raw) return '';

  // Escapar HTML básico primero (por seguridad)
  const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Aplicar negritas **texto** → <strong>texto</strong>
  const bold = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  const lines = raw.split('\n');
  const result = [];
  let inUl = false;
  let inOl = false;
  let paraLines = [];

  const flushPara = () => {
    if (paraLines.length) {
      const joined = paraLines.join(' ').trim();
      if (joined) result.push(`<p>${bold(escape(joined))}</p>`);
      paraLines = [];
    }
  };

  const closeList = () => {
    if (inUl) { result.push('</ul>'); inUl = false; }
    if (inOl) { result.push('</ol>'); inOl = false; }
  };

  for (let raw_line of lines) {
    const line = raw_line.trimEnd();

    // Línea vacía → cierra párrafo en curso
    if (!line.trim()) {
      flushPara();
      closeList();
      continue;
    }

    // Lista numerada: "1. texto", "1) texto"
    const numMatch = line.match(/^\s*(\d+)[.)]\s+(.+)/);
    if (numMatch) {
      flushPara();
      if (!inOl) { closeList(); result.push('<ol>'); inOl = true; }
      result.push(`<li>${bold(escape(numMatch[2]))}</li>`);
      continue;
    }

    // Lista con guión o asterisco: "- texto", "* texto", "• texto"
    const bulletMatch = line.match(/^\s*[-*•]\s+(.+)/);
    if (bulletMatch) {
      flushPara();
      if (!inUl) { closeList(); result.push('<ul>'); inUl = true; }
      result.push(`<li>${bold(escape(bulletMatch[1]))}</li>`);
      continue;
    }

    // Línea normal → acumular en párrafo
    closeList();
    paraLines.push(line.trim());
  }

  flushPara();
  closeList();

  return result.join('\n');
}

function highlight(text, query) {
  if (!query || !text) return text || '';
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark class="highlight">$1</mark>');
}

// ─── VER LECCION ──────────────────────────────────────────────────────────────
function verLeccion(leccionId, fromView = null) {
  leccionActual = lecciones.find(l => l.id === leccionId);
  if (!leccionActual) return;

  if (fromView === 'repaso') {
    document.getElementById('back-from-leccion').onclick = () => showView('repaso');
    document.getElementById('back-from-leccion').textContent = '← Repaso rápido';
  } else if (fromView === 'autor') {
    document.getElementById('back-from-leccion').onclick = () => showView('autor');
    document.getElementById('back-from-leccion').textContent = '← Vista autor';
  } else if (fromView === 'favoritos') {
    document.getElementById('back-from-leccion').onclick = () => showView('favoritos');
    document.getElementById('back-from-leccion').textContent = '← Favoritos';
  } else {
    document.getElementById('back-from-leccion').onclick = () => volverDeLeccion();
    document.getElementById('back-from-leccion').textContent = '← Lecciones';
  }

  const completada = progreso.some(p => p.tipo === 'leccion' && p.item_id === leccionId && p.resultado === 'correcta');
  const fav = isFavLeccion(leccionId);

  let html = '';

  // Imagen principal
  if (leccionActual.imagen_principal) {
    html += `<div class="leccion-imagen-wrap">
      <img src="${leccionActual.imagen_principal}" alt="${leccionActual.titulo}" loading="lazy" onerror="this.parentElement.style.display='none'">
      ${leccionActual.imagen_caption ? `<div class="leccion-imagen-caption">${leccionActual.imagen_caption}</div>` : ''}
    </div>`;
  }

  html += `<h2 class="leccion-titulo">${leccionActual.titulo}</h2>`;

  // Cuerpo con formateo
  html += `<div class="leccion-cuerpo formatted-text">${formatText(leccionActual.cuerpo)}</div>`;

  // Detalles con formateo
  if (leccionActual.detalles?.length) {
    html += `<div class="detalles-grid">` +
      leccionActual.detalles.map(d =>
        `<div class="detalle-card">
          <h4>${d.titulo || ''}</h4>
          <div class="formatted-text">${formatText(d.cuerpo || d.contenido || '')}</div>
        </div>`
      ).join('') + `</div>`;
  }

  // Conexión cruzada con formateo
  if (leccionActual.conexion_cruzada) {
    html += `<div class="conexion-box">
      <div class="conexion-label">⟳ Conexión cruzada</div>
      <div class="formatted-text">${formatText(leccionActual.conexion_cruzada)}</div>
    </div>`;
  }

  // Autocorrección con formateo
  if (leccionActual.autocorreccion) {
    html += `<div class="conexion-box" style="border-left-color: #3498db55;">
      <div class="conexion-label" style="color:#3498db88">⚠ Autocorrección metodológica</div>
      <div class="formatted-text">${formatText(leccionActual.autocorreccion)}</div>
    </div>`;
  }

  // Autores relacionados
  if (leccionActual.autores_relacionados?.length) {
    html += `<div style="margin-bottom:0.5rem; font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em;">Autores relacionados</div>`;
    html += `<div class="autores-rel">` +
      leccionActual.autores_relacionados.map(a =>
        `<span class="autor-tag" onclick="verAutor('${encodeURIComponent(a)}')">${a}</span>`
      ).join('') + `</div>`;
  }

  // Lección siguiente
  const leccionesLibro = lecciones.filter(l => l.libro_id === leccionActual.libro_id).sort((a, b) => a.orden - b.orden);
  const idxActual = leccionesLibro.findIndex(l => l.id === leccionId);
  const leccionSiguiente = idxActual >= 0 && idxActual < leccionesLibro.length - 1 ? leccionesLibro[idxActual + 1] : null;

  html += `<div class="leccion-actions">
    ${!completada
      ? `<button class="action-btn primary" onclick="marcarCompletada('${leccionId}')">✓ Marcar completada</button>`
      : `<span style="color:var(--success); font-size:0.8rem; align-self:center;">✓ Completada</span>`
    }
    <button class="action-btn secondary" id="btn-fav-leccion" onclick="toggleFavLeccionDetalle('${leccionId}', this)">${fav ? '★ Favorita' : '☆ Favoritos'}</button>
    <button class="action-btn secondary" onclick="exportarPDF('${leccionId}')">⬇ PDF</button>
    <button class="action-btn secondary" onclick="testDeLeccion('${leccionActual.libro_id}')">📝 Test libro</button>
    ${leccionSiguiente ? `<button class="action-btn primary" onclick="verLeccion('${leccionSiguiente.id}'); window.scrollTo(0,0);">Siguiente →</button>` : ''}
  </div>`;

  document.getElementById('leccion-contenido').innerHTML = html;
  showView('leccion');
}

function toggleFavLeccionDetalle(id, btn) {

async function marcarCompletada(leccionId) {

    await sb('progreso', {
      method: 'POST',
      body: JSON.stringify({ tipo: 'leccion', item_id: leccionId, resultado: 'correcta', fecha: new Date().toISOString() })
    });
    progreso.push({ tipo: 'leccion', item_id: leccionId, resultado: 'correcta', fecha: new Date().toISOString() });
    toast('✓ Lección completada');
    verLeccion(leccionId);
    renderStats();
  } catch(e) { toast('Error: ' + e.message); }

// ─── EXPORT PDF ───────────────────────────────────────────────────────────────
function exportarPDF(leccionId) {
  const lec = lecciones.find(l => l.id === leccionId);
  if (!lec) return;
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const margin = 20;
    const pageWidth = 210 - margin * 2;
    let y = 20;

    const addText = (text, size, color, bold = false) => {
      doc.setFontSize(size);
      doc.setTextColor(...color);
      doc.setFont(undefined, bold ? 'bold' : 'normal');
      // Strip Markdown-style markers for PDF
      const clean = String(text || '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/^[-*•]\s+/gm, '  · ').replace(/^\d+[.)]\s+/gm, '  ');
      const lines = doc.splitTextToSize(clean, pageWidth);
      lines.forEach(line => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.text(line, margin, y);
        y += size * 0.45;
      });
      y += 3;
    };

    addText('Segundo Cerebro Soberano', 9, [150, 150, 150]);
    if (libroActual) addText(`${libroActual.titulo} — ${libroActual.autor}`, 9, [150, 150, 150]);
    y += 3;
    addText(lec.titulo, 16, [201, 168, 76], true);
    y += 3;
    addText(lec.cuerpo, 11, [220, 220, 220]);
    y += 3;

    if (lec.detalles?.length) {
      lec.detalles.forEach(d => {
        addText(d.titulo, 10, [150, 120, 50], true);
        addText(d.cuerpo || d.contenido || '', 10, [180, 180, 180]);
        y += 2;
      });
    }

    if (lec.conexion_cruzada) {
      addText('CONEXIÓN CRUZADA', 8, [130, 100, 30], true);
      addText(lec.conexion_cruzada, 10, [180, 180, 180]);
    }

    doc.save(`${lec.titulo.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
    toast('PDF generado');
  } catch(e) { toast('Error: ' + e.message); console.error(e); }
}

// ─── TEST ─────────────────────────────────────────────────────────────────────
function iniciarTest(libroId = null) {
  let pool = libroId ? preguntas.filter(p => p.libro_id === libroId) : [...preguntas];
  const incorrectas = new Set(progreso.filter(p => p.tipo === 'pregunta' && p.resultado === 'incorrecta').map(p => p.item_id));
  pool.sort((a, b) => (incorrectas.has(a.id) ? -1 : 1) - (incorrectas.has(b.id) ? -1 : 1));
  if (!pool.length) { toast('Sin preguntas disponibles'); return; }
  testPreguntas = pool.slice(0, Math.min(10, pool.length));
  testIdx = 0; testRespuestas = [];
  showView('test');
  renderPregunta();
}

function testDeLeccion(libroId) { iniciarTest(libroId); }

function renderPregunta() {
  const p = testPreguntas[testIdx];
  if (!p) return;
  const total = testPreguntas.length;
  document.getElementById('test-progress-fill').style.width = `${(testIdx / total) * 100}%`;
  document.getElementById('test-counter').textContent = `Pregunta ${testIdx + 1} de ${total}`;
  document.getElementById('btn-siguiente').style.display = 'none';
  document.getElementById('pregunta-container').innerHTML = `
    <div class="pregunta-card">
      <div class="pregunta-eje">${p.eje || ''}</div>
      <div class="pregunta-texto">${p.texto}</div>
      <div class="opciones-grid">
        ${(p.opciones || []).map((op, i) =>
          `<button class="opcion-btn" onclick="responder(${i})" data-idx="${i}">${op}</button>`
        ).join('')}
      </div>
      <div id="feedback-pregunta"></div>
    </div>`;
}

async function responder(idx) {
  const p = testPreguntas[testIdx];
  const correcta = idx === p.correcta;
  document.querySelectorAll('.opcion-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === p.correcta) btn.classList.add('correcta');
    else if (i === idx && !correcta) btn.classList.add('incorrecta');
  });
  document.getElementById('feedback-pregunta').innerHTML = `
    <div class="feedback-box ${correcta ? 'correcto' : 'incorrecto'}">
      ${correcta ? '✓ Correcto' : '✗ Incorrecto'} — ${p.explicacion || ''}
    </div>`;
  testRespuestas.push({ pregunta: p, respuesta: idx, correcta });
  document.getElementById('btn-siguiente').style.display = 'block';
  try {
    await sb('progreso', { method: 'POST', body: JSON.stringify({ tipo: 'pregunta', item_id: p.id, resultado: correcta ? 'correcta' : 'incorrecta', fecha: new Date().toISOString() }) });
    progreso.push({ tipo: 'pregunta', item_id: p.id, resultado: correcta ? 'correcta' : 'incorrecta', fecha: new Date().toISOString() });
  } catch(e) { console.error(e); }
}

async function siguientePregunta() {
  testIdx++;
  if (testIdx >= testPreguntas.length) await finalizarTest();
  else renderPregunta();
}

async function finalizarTest() {
  const total = testRespuestas.length;
  const correctas = testRespuestas.filter(r => r.correcta).length;
  const pct = total ? Math.round(correctas / total * 100) : 0;
  const fallos = testRespuestas.filter(r => !r.correcta).map(r => r.pregunta.texto);
  try {
    await sb('sesiones', { method: 'POST', body: JSON.stringify({ total, correctas, porcentaje: pct, fallos, fecha: new Date().toISOString() }) });
  } catch(e) { console.error(e); }
  document.getElementById('resultados-container').innerHTML = `
    <div class="resultado-card">
      <div style="font-size:0.85rem; color:var(--text-dim)">Resultado del test</div>
      <div class="resultado-score">${pct}%</div>
      <div class="resultado-label">${correctas} / ${total} correctas</div>
      ${fallos.length ? `<div class="fallos-list"><p class="section-title">Para repasar:</p>${fallos.map(f => `<div class="fallo-item">${f}</div>`).join('')}</div>` : '<p style="color:var(--success)">¡Test perfecto!</p>'}
      <div style="display:flex;gap:0.8rem;justify-content:center;margin-top:1.5rem">
        <button class="action-btn primary" onclick="iniciarTest()">Nuevo test</button>
        <button class="action-btn secondary" onclick="showView('home')">Inicio</button>
      </div>
    </div>`;
  showView('resultados');
}

// ─── REPASO RAPIDO ────────────────────────────────────────────────────────────
async function comenzarRepasoRapido() {
  const completadas = new Set(progreso.filter(p => p.tipo === 'leccion' && p.resultado === 'correcta').map(p => p.item_id));
  const fechasPorLeccion = {};
  progreso.filter(p => p.tipo === 'leccion').forEach(p => {
    if (!fechasPorLeccion[p.item_id] || p.fecha > fechasPorLeccion[p.item_id]) fechasPorLeccion[p.item_id] = p.fecha;
  });
  const completadasArr = [...completadas].sort((a, b) => {
    const fa = fechasPorLeccion[a] || '2000-01-01';
    const fb = fechasPorLeccion[b] || '2000-01-01';
    return fa < fb ? -1 : 1;
  });
  const ids = completadasArr.slice(0, 5);
  repasoLecciones = ids.map(id => lecciones.find(l => l.id === id)).filter(Boolean);
  if (repasoLecciones.length < 5) {
    const restantes = lecciones.filter(l => !completadas.has(l.id)).slice(0, 5 - repasoLecciones.length);
    repasoLecciones = [...repasoLecciones, ...restantes];
  }
  if (!repasoLecciones.length) { toast('Sin lecciones para repasar'); return; }
  repasoIdx = 0;
  showView('repaso');
  renderRepasoLeccion();
}

function renderRepasoLeccion() {
  const lec = repasoLecciones[repasoIdx];
  if (!lec) return;
  document.getElementById('repaso-counter').textContent = `Lección ${repasoIdx + 1} de ${repasoLecciones.length}`;
  const libro = libros.find(l => l.id === lec.libro_id);
  const completada = progreso.some(p => p.tipo === 'leccion' && p.item_id === lec.id && p.resultado === 'correcta');
  let html = '';
  if (libro) html += `<div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem">${libro.autor} — ${libro.titulo}</div>`;
  if (lec.imagen_principal) {
    html += `<div class="leccion-imagen-wrap">
      <img src="${lec.imagen_principal}" alt="${lec.titulo}" loading="lazy" onerror="this.parentElement.style.display='none'">
      ${lec.imagen_caption ? `<div class="leccion-imagen-caption">${lec.imagen_caption}</div>` : ''}
    </div>`;
  }
  html += `<h2 class="leccion-titulo">${lec.titulo}</h2>`;
  html += `<div class="leccion-cuerpo formatted-text">${formatText(lec.cuerpo)}</div>`;
  if (lec.detalles?.length) {
    html += `<div class="detalles-grid">` +
      lec.detalles.map(d => `<div class="detalle-card"><h4>${d.titulo}</h4><div class="formatted-text">${formatText(d.cuerpo || d.contenido || '')}</div></div>`).join('') +
      `</div>`;
  }
  html += `<div style="margin-top:1rem">
    ${!completada
      ? `<button class="action-btn primary" onclick="marcarCompletadaRepaso('${lec.id}')">✓ Marcar completada</button>`
      : `<span style="color:var(--success);font-size:0.8rem">✓ Completada</span>`}
  </div>`;
  document.getElementById('repaso-container').innerHTML = html;
  document.getElementById('btn-repaso-prev').style.visibility = repasoIdx > 0 ? 'visible' : 'hidden';
  document.getElementById('btn-repaso-next').textContent = repasoIdx < repasoLecciones.length - 1 ? 'Siguiente →' : 'Finalizar';
}

function repasoSiguiente() {
  if (repasoIdx < repasoLecciones.length - 1) { repasoIdx++; renderRepasoLeccion(); }
  else { toast('✓ Repaso completado'); showView('home'); }
}

function repasoAnterior() { if (repasoIdx > 0) { repasoIdx--; renderRepasoLeccion(); } }

async function marcarCompletadaRepaso(leccionId) {
  await marcarCompletada(leccionId);
  renderRepasoLeccion();
}

// ─── LECCION ALEATORIA ────────────────────────────────────────────────────────
function leccionAleatoria() {
  const completadas = new Set(progreso.filter(p => p.tipo === 'leccion' && p.resultado === 'correcta').map(p => p.item_id));
  const noCompletadas = lecciones.filter(l => !completadas.has(l.id));
  const pool = noCompletadas.length ? noCompletadas : lecciones;
  if (!pool.length) { toast('Sin lecciones disponibles'); return; }
  const lec = pool[Math.floor(Math.random() * pool.length)];
  libroActual = libros.find(l => l.id === lec.libro_id);
  verLeccion(lec.id);
}

// ─── VISTA AUTOR ──────────────────────────────────────────────────────────────
function verAutor(encodedAutor) {
  const autor = decodeURIComponent(encodedAutor);
  const lecsAutor = lecciones.filter(l => l.autores_relacionados?.includes(autor));
  document.getElementById('autor-nombre-header').textContent = autor;
  document.getElementById('autor-count-header').textContent = `${lecsAutor.length} lecciones con este autor`;
  const completadas = new Set(progreso.filter(p => p.tipo === 'leccion' && p.resultado === 'correcta').map(p => p.item_id));
  document.getElementById('autor-lecciones-container').innerHTML = lecsAutor.length
    ? lecsAutor.map(lec => {
        const libro = libros.find(l => l.id === lec.libro_id);
        const comp = completadas.has(lec.id);
        return `<div class="leccion-item ${comp ? 'completada' : ''}" onclick="verLeccion('${lec.id}', 'autor')">
          <div class="leccion-left">
            <h4>${lec.titulo}</h4>
            <div class="leccion-meta-row"><span class="leccion-orden">${libro ? libro.titulo : '—'}</span></div>
          </div>
          <span class="leccion-status ${comp ? 'ok' : 'pending'}">${comp ? '✓' : '○'}</span>
        </div>`;
      }).join('')
    : `<div class="empty">Sin lecciones para este autor</div>`;
  showView('autor');
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${name}`).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (name === 'home') document.getElementById('nav-home')?.classList.add('active');
  if (name === 'favoritos') document.getElementById('nav-favoritos')?.classList.add('active');
  if (name === 'test' || name === 'resultados') document.getElementById('nav-test')?.classList.add('active');
  window.scrollTo(0, 0);
  if (name === 'home') { renderStats(); renderLibros(); }
  if (name === 'favoritos') renderFavoritos();
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── START ────────────────────────────────────────────────────────────────────
init();
</script>
