<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCS — Mapa de Conexiones</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mapa.css">
</head>
<body>

<header class="header">
  <div class="logo">SCS — Mapa</div>
  <div class="header-right">
    <div class="legend" id="legend"></div>
    <a href="index.html" class="back-link">← App</a>
  </div>
</header>

<div class="eje-filters" id="eje-filters"></div>

<canvas id="canvas"></canvas>

<div class="panel" id="panel">
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">✕ cerrar</button>
    <div class="panel-eje" id="panel-eje"></div>
    <div class="panel-autor" id="panel-autor"></div>
    <div class="panel-titulo" id="panel-titulo"></div>
    <div class="panel-tesis" id="panel-tesis"></div>
  </div>
  <div class="panel-body">
    <div class="conexiones-titulo">Conexiones en el corpus</div>
    <div id="panel-conexiones"></div>
  </div>
</div>

<div class="hint">Click en un nodo · Arrastrar para mover · Scroll para zoom</div>

<script src="mapa.js" defer></script>
</body>
</html>
