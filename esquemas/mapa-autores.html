<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCS · Mapa de Conexiones entre Autores</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#070a09;--surface:#0d1210;--surface2:#121a17;--border:#172018;--border2:#1e2e22;
  --text:#c8d4c0;--text2:#6a8a70;--text3:#2a4a30;
  --eje1:#4a9a7a; /* neurológico */
  --eje2:#7a6aaa; /* epistemológico */
  --eje3:#aa7a3a; /* civilizacional */
  --eje4:#4a7aaa; /* financiero */
  --eje5:#aa4a6a; /* individual */
  --gold:#b8a848;
}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',serif;min-height:100vh;padding:1.5rem 1rem 3rem;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
.header{text-align:center;margin-bottom:1.5rem;}
.header-label{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.25em;color:var(--text3);text-transform:uppercase;margin-bottom:.4rem;}
.header h1{font-family:'Cinzel',serif;font-size:clamp(1.2rem,3vw,1.8rem);color:var(--gold);letter-spacing:.06em;margin-bottom:.2rem;}
.header p{font-size:.85rem;color:var(--text2);font-style:italic;}
.line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:.8rem auto 0;}

/* LEGEND */
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.2rem;}
.leg{display:flex;align-items:center;gap:.35rem;font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.leg-dot{width:10px;height:10px;border-radius:50%;}

/* MAP */
.map-container{width:100%;max-width:960px;position:relative;}
.map-svg{width:100%;height:auto;display:block;}

/* Node tooltips */
.node-group{cursor:pointer;}
.node-group circle{transition:all .25s;}
.node-group:hover circle{filter:brightness(1.3);}
.node-group text{pointer-events:none;}

/* DETAIL PANEL */
.detail{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:1.2rem 1.5rem;margin-top:1rem;display:none;width:100%;max-width:960px;}
.detail.visible{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.d-header{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem;}
.d-eje{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:.2rem .5rem;border-radius:3px;border:1px solid currentColor;}
.d-name{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;}
.d-book{font-size:.85rem;color:var(--text2);font-style:italic;margin-bottom:.8rem;}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.d-box h4{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.5rem;padding-bottom:.3rem;border-bottom:1px solid var(--border);}
.d-box p{font-size:.82rem;color:var(--text2);line-height:1.7;}
.conn-list{list-style:none;padding:0;}
.conn-list li{font-size:.8rem;color:var(--text2);padding:.2rem 0 .2rem 1rem;position:relative;line-height:1.5;}
.conn-list li::before{content:'→';position:absolute;left:0;color:var(--gold);font-size:.8rem;}
.conn-author{color:var(--text);font-weight:600;}

@media(max-width:600px){.d-grid{grid-template-columns:1fr;}}
</style>
</head>

<script>
const AUTHORS = {
  kahneman:{eje:'Epistemológico',color:'#9a8aee',name:'Daniel Kahneman',book:'Pensar rápido, pensar despacio (2011)',thesis:'El cerebro opera con dos sistemas: Sistema 1 (rápido, automático, emocional) y Sistema 2 (lento, deliberado, lógico). La mayoría de errores de juicio ocurren cuando el S1 responde sin invocar al S2. La teoría prospectiva explica la aversión a la pérdida y el efecto de encuadre.',connections:['<span class="conn-author">Cialdini</span> — Sus seis principios explotan el Sistema 1; el S2 es el antídoto pero es perezoso','<span class="conn-author">Dobelli</span> — Los 99 sesgos son manifestaciones del S1 mal calibrado','<span class="conn-author">Sapolsky</span> — Ancla S1/S2 en neurobiología: amígdala vs. córtex prefrontal','<span class="conn-author">Tetlock</span> — Los superprevisores entrenan el S2 para calibrar el S1','<span class="conn-author">Taleb</span> — La narrativa retrospectiva es S1 construyendo causalidad en el ruido','<span class="conn-author">Weinstein</span> — El stop-loss predefinido es S2 neutralizando el S1 bajo pérdidas']},
  sapolsky:{eje:'Neurológico-Biológico',color:'#6abaa0',name:'Robert Sapolsky',book:'Compórtate (2017)',thesis:'El comportamiento humano es el resultado de la interacción de biología, evolución, hormones y cultura. No existe libre albedrío en sentido clásico: cada acción es el resultado de causas que se remontan hasta la biología molecular y la evolución. Reduccionismo biológico matizado.',connections:['<span class="conn-author">Kahneman</span> — S1/S2 tienen correlatos neurobiológicos en amígdala y córtex prefrontal','<span class="conn-author">Buzsáki</span> — Las oscilaciones cerebrales de Buzsáki son el sustrato de los ritmos de S1/S2','<span class="conn-author">McGilchrist</span> — Complementa la perspectiva hemisférica con la neuroendocrinología','<span class="conn-author">Cialdini</span> — La reciprocidad y la prueba social tienen base en circuitos de recompensa dopaminérgicos']},
  buzsaki:{eje:'Neurológico-Biológico',color:'#6abaa0',name:'György Buzsáki',book:'Rhythms of the Brain (2006)',thesis:'El cerebro no es un sistema reactivo que responde a inputs: genera ritmos propios (oscilaciones) que organizan la información. Las oscilaciones en distintas frecuencias (theta, gamma, sharp-wave ripples) coordinan la memoria, la atención y la cognición. El cerebro es endógeno.',connections:['<span class="conn-author">Sapolsky</span> — Las hormonas del estrés modulan las frecuencias oscilatorias cerebrales','<span class="conn-author">McGilchrist</span> — Los ritmos hemisféricos diferentes son un patrón oscilatorio de Buzsáki a mayor escala','<span class="conn-author">Kahneman</span> — Las oscilaciones gamma corresponden al "binding" rápido del Sistema 1']},
  mcgilchrist:{eje:'Neurológico-Biológico',color:'#6abaa0',name:'Iain McGilchrist',book:'El maestro y su emisario (2009)',thesis:'Los hemisferios cerebrales tienen modos radicalmente distintos de conocer el mundo. El derecho capta la totalidad, la ambigüedad y el contexto; el izquierdo analiza, abstrae y reduce. La civilización occidental ha cedido el control al hemisferio izquierdo con consecuencias culturales profundas.',connections:['<span class="conn-author">Buzsáki</span> — Los patrones oscilatorios distintos por hemisferio sustentan las diferencias de McGilchrist','<span class="conn-author">Sapolsky</span> — La lateralización tiene correlatos en los sistemas de estrés y afecto','<span class="conn-author">Kahneman</span> — El hemisferio izquierdo recuerda al Sistema 2; el derecho al Sistema 1 en ciertos aspectos']},
  cialdini:{eje:'Psicología',color:'#da6a8a',name:'Robert Cialdini',book:'Influencia (1984)',thesis:'Seis principios psicológicos (reciprocidad, consistencia, prueba social, simpatía, autoridad, escasez) activan la obediencia automática. Son adaptativos en origen pero pueden ser explotados deliberadamente. La defensa requiere reconocer el disparador, no eliminarlo.',connections:['<span class="conn-author">Kahneman</span> — Los seis principios explotan el Sistema 1; son disparadores que evitan al Sistema 2','<span class="conn-author">Sapolsky</span> — Reciprocidad y prueba social tienen base en circuitos neurobiológicos de recompensa social','<span class="conn-author">Dobelli</span> — Mismos mecanismos, perspectiva distinta: Dobelli ve errores individuales; Cialdini ve explotación externa','<span class="conn-author">Pre-suasión</span> — El libro complementario que mapea lo que ocurre antes del mensaje']},
  presuasion:{eje:'Psicología',color:'#da6a8a',name:'Robert Cialdini',book:'Pre-suasión (2016)',thesis:'El momento previo al mensaje determina su receptividad tanto como el mensaje mismo. Quien controla la atención previa (a través de priming, geografía de la atención y asociaciones) controla parcialmente la evaluación. Añade el séptimo principio: la unidad.',connections:['<span class="conn-author">Cialdini/Influencia</span> — Capa temporal anterior a los seis principios; juntos cubren antes + durante','<span class="conn-author">Kahneman</span> — El priming es el mecanismo del Sistema 1 que subyace a toda la pre-suasión','<span class="conn-author">Dobelli</span> — El efecto de anclaje es un caso particular de priming cognitivo']},
  dobelli:{eje:'Epistemológico',color:'#9a8aee',name:'Rolf Dobelli',book:'El arte de pensar (2011)',thesis:'Catálogo de 99 errores sistemáticos del pensamiento, agrupados en sesgos cognitivos, heurísticas y falacias lógicas. El conocimiento declarativo de los sesgos no produce desbiasado: se requieren cambios procedimentales.',connections:['<span class="conn-author">Kahneman</span> — Marco teórico que unifica los 99 sesgos bajo S1/S2','<span class="conn-author">Cialdini</span> — Dobelli ve errores individuales; Cialdini ve la explotación externa de los mismos errores','<span class="conn-author">Tetlock</span> — Los superprevisores de Tetlock son el antídoto práctico a los sesgos de Dobelli','<span class="conn-author">Taleb</span> — Los sesgos de Dobelli se amplifican en distribuciones de cola gruesa (Extremistán)']},
  tetlock:{eje:'Epistemológico',color:'#9a8aee',name:'Philip Tetlock',book:'Superforecasting (2015)',thesis:'La calibración — que el nivel de confianza corresponda a la frecuencia de acierto — es una habilidad entrenable. Los superprevisores piensan probabilísticamente, actualizan con nueva información y dividen los problemas en componentes. Los expertos con alta notoriedad son peores predictores que los superprevisores amateurs.',connections:['<span class="conn-author">Kahneman</span> — La calibración es entrenar al S2 para corregir el exceso de confianza del S1','<span class="conn-author">Taleb</span> — Complementarios: Taleb enfatiza los límites de la predicción; Tetlock muestra que la calibración mejora dentro de esos límites','<span class="conn-author">Dobelli</span> — Los superprevisores son la implementación práctica del desbiasado que Dobelli describe teóricamente']},
  taleb:{eje:'Financiero/Epistemológico',color:'#6aaada',name:'Nassim Nicholas Taleb',book:'El cisne negro / Antifrágil / Fooled by Randomness',thesis:'Los eventos de cola gruesa (cisnes negros) dominan los resultados en Extremistán. La narrativa retrospectiva convierte el azar en causalidad. La fragilidad/robustez/antifragi­lidad son las categorías relevantes para la gestión del riesgo bajo incertidumbre radical.',connections:['<span class="conn-author">Weinstein</span> — El análisis técnico de Weinstein es una forma de gestión de la fragilidad: stops y posición sizing','<span class="conn-author">Kahneman</span> — La narrativa retrospectiva es el S1 construyendo causalidad en distribuciones aleatorias','<span class="conn-author">Mises</span> — Convergencia austriaca: mercados como sistemas complejos no predecibles centralmente','<span class="conn-author">Tetlock</span> — Tensión productiva: Taleb señala límites de predicción; Tetlock demuestra que se puede calibrar dentro de esos límites']},
  weinstein:{eje:'Financiero',color:'#6aaada',name:'Stan Weinstein',book:'Secretos para Ganar en Mercados Alcistas y Bajistas (1988)',thesis:'Los mercados atraviesan cuatro estadios cíclicos (acumulación, avance, distribución, declive). El análisis de la media móvil de 30 semanas y el volumen permite identificar el estadio actual. Solo comprar en Estadio 2; salir en Estadio 3; ignorar el ruido.',connections:['<span class="conn-author">Taleb</span> — El stop-loss de Weinstein es gestión de la fragilidad de Taleb en mercados','<span class="conn-author">Kahneman</span> — Los procedimientos de Weinstein neutralizan la aversión a la pérdida del Sistema 1','<span class="conn-author">Cialdini</span> — El plan de trading predefinido es el antídoto a la influencia bajo presión emocional']},
  mises:{eje:'Civilizacional',color:'#daa06a',name:'Ludwig von Mises',book:'La Acción Humana (1949)',thesis:'La economía como ciencia de la acción humana propositiva (praxeología). El orden de mercado emerge de millones de acciones individuales que coordinan el conocimiento disperso. La planificación central es imposible por el problema del cálculo económico.',connections:['<span class="conn-author">Taleb</span> — La emergencia del orden de Mises es compatible con la impredecibilidad de los sistemas complejos de Taleb','<span class="conn-author">Strauss/Howe</span> — Los ciclos civilizacionales de The Fourth Turning operan sobre el sustrato económico que Mises describe']},
  strauss:{eje:'Civilizacional',color:'#daa06a',name:'Strauss & Howe',book:'The Fourth Turning (1997)',thesis:'La historia angloamericana se articula en ciclos de ~80 años compuestos por cuatro turnos generacionales. El Cuarto Giro es una crisis que destruye el orden viejo y crea uno nuevo. Las generaciones moldean la historia y la historia moldea las generaciones.',connections:['<span class="conn-author">Mises</span> — El marco económico austriaco opera dentro de los ciclos civilizacionales de Strauss/Howe','<span class="conn-author">Harpur</span> — Los arquetipos míticos de Harpur resuenan con los arquetipos generacionales de Strauss/Howe','<span class="conn-author">Taleb</span> — Los Cuartos Giros son cisnes negros estructurales: raros pero predecibles en su llegada, no en su forma']},
  harpur:{eje:'Civilizacional',color:'#daa06a',name:'Tom Harpur',book:'El fuego secreto (2004)',thesis:'Los mitos religiosos de distintas culturas comparten una estructura arquetípica común. El Cristo solar es un mito universal antes de ser una figura histórica. La dimensión mítica de la conciencia humana es irreductible al racionalismo.',connections:['<span class="conn-author">McGilchrist</span> — El pensamiento mítico es propio del hemisferio derecho que McGilchrist reivindica','<span class="conn-author">Strauss/Howe</span> — Los arquetipos míticos de Harpur resuenan con los arquetipos generacionales del ciclo saecular']},
  hill:{eje:'Individual/Psicología',color:'#da6a8a',name:'Napoleon Hill',book:'Burlar al Diablo (1938/2011)',thesis:'Los patrones de pensamiento habitual determinan los resultados vitales. El miedo, la indecisión y la procrastinación son mecanismos de "hipnosis de masa" que mantienen a la mayoría en la mediocridad. La mente definitiva requiere propósito específico y pensamiento independiente.',connections:['<span class="conn-author">Cialdini</span> — La hipnosis de masa de Hill es la prueba social y la autoridad de Cialdini operando a escala cultural','<span class="conn-author">Kahneman</span> — Los hábitos de pensamiento de Hill son patrones del Sistema 1; cambiarlos requiere S2 consistente','<span class="conn-author">Dobelli</span> — El pensamiento independiente de Hill es el antídoto a los sesgos de conformidad de Dobelli']},
  dyer:{eje:'Individual',color:'#da6a8a',name:'Wayne Dyer',book:'Tus Zonas Sagradas / Evite Ser Utilizado',thesis:'La autorrealización requiere liberarse de la aprobación externa y de los patrones de pensamiento limitantes heredados. Las "zonas sagradas" son compromisos emocionales irracionales con ideas propias o ajenas que bloquean el crecimiento.',connections:['<span class="conn-author">Hill</span> — Mismo eje individual: los obstáculos internos al desarrollo personal','<span class="conn-author">Cialdini</span> — Las zonas sagradas son compromisos + consistencia de Cialdini aplicados a creencias propias']}
};

function selectAuthor(id){
  const a=AUTHORS[id];
  if(!a) return;
  const detail=document.getElementById('detail');
  const eje=document.getElementById('d-eje');
  eje.textContent=a.eje;
  eje.style.color=a.color;
  eje.style.borderColor=a.color;
  document.getElementById('d-name').textContent=a.name;
  document.getElementById('d-name').style.color=a.color;
  document.getElementById('d-book').textContent=a.book;
  document.getElementById('d-thesis').textContent=a.thesis;
  document.getElementById('d-connections').innerHTML=a.connections.map(c=>`<li>${c}</li>`).join('');
  detail.classList.remove('visible');void detail.offsetWidth;detail.classList.add('visible');
}
</script>
